# Builds the Linux and Windows release zips (see build.sh and build.cmd) and, for a pushed tag
# such as v0.1.0, publishes both as a GitHub Release. Linux builds in Debian 12, whose older
# glibc (2.36) lets the binary run on most distributions from 2022 on; one built on a newer
# system needs that system's glibc. Windows builds with MSYS2's UCRT64 GCC, as build.cmd does.
# Run by hand (Actions > Release > Run workflow), it only keeps the zips as build artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build tools and SDL3's dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates build-essential cmake \
            git ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl-dev libgl-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev

      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FoxRV-linux
          path: build/FoxRV-*-linux-*.zip

  windows:
    runs-on: windows-latest
    steps:
      # The runner's own C:\msys64, where build.cmd looks for GCC.
      - uses: msys2/setup-msys2@v2
        with:
          release: false
          update: false
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: FoxRV-windows
          path: build/FoxRV-*-windows-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
