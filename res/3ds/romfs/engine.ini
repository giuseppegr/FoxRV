; FOXRV engine settings for the Nintendo 3DS. Built into the .3dsx and copied on first run to
; sdmc:/3ds/foxrv/engine.ini, which is the one read and saved from then on. Every key is
; optional; see engine.ini in the source for all of them.

[video]
view_size = 320x200     ; the original screen, centred on the 400x240 top screen
upscale = 1             ; 1 = the original blocky pixels (larger values don't fit the 3DS's memory well)
vsync = 1

[audio]
device = speaker        ; the 3DS build has the PC speaker only (the AdLib emulator is too slow there)
master_volume = 80
music_volume = 100
sfx_volume = 100

[engine]
game_dir = sdmc:/3ds/foxrv/game     ; FOX.COM and the .SQZ files of the original DOS game

[input]
; Buttons by position, as SDL names them: pad:a = B (bottom), pad:b = A (right), pad:x = Y,
; pad:y = X, pad:back = Select, pad:leftshoulder = L, pad:rightshoulder = R.
; Options > Map controller on the main menu rewrites these lines.
