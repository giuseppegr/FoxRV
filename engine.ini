; FOXRV engine settings. Every key is optional; missing keys use the built-in defaults.
; Read from the working directory first, then from next to the executable.

[video]
scale = 3               ; initial window height = scale x min_view_height (1280x720 at 3, 16:9)
fullscreen = 0          ; F11 or Alt+Enter toggle at runtime
vsync = 1               ; sync to the monitor refresh (no tearing)
max_fps = 0             ; frame-rate cap, e.g. 60; 0 = no cap besides vsync. Game speed doesn't change.
aspect = auto           ; auto = the view fills the window/monitor; or force one, e.g. 16:9 (black bars elsewhere)
min_view_height = 240   ; game pixels shown at least vertically (original: 200). Pixels are square and scaled
                        ; by the largest whole number that keeps this, so 1280x720 shows 427x240, 1920x1080 480x270
upscale = 1          ; smooth the art's staircase edges when loading: 1 = off (original blocky pixels),
                        ; 2 = Scale2x, 3 = Scale3x, 4 = Scale2x twice; auto = fits the pixel scale at startup

[audio]
master_volume = 80      ; 0..100
music_volume = 100      ; 0..100
sfx_volume = 100        ; 0..100
music_buffer_ms = 2000  ; music rendered ahead in RAM; a rendering stall shorter than this is never heard
tick_hz = 72.826        ; music driver rate (original PIT divisor 0x4000); higher = faster music

[engine]
logic_hz = 36.413       ;5 game frames per second: 36.413 = original (72.826 Hz timer / 2); acts as a game-speed knob
interpolate = 1         ; draw between game frames, smooth on 60/144 Hz displays (0 = original stepped motion)
game_dir = game         ; the original game's files (FOX.COM and the .SQZ files), looked for next to
                        ; the executable, then relative to the working directory

[camera]
mode = original         ; original = the original's speed (one tile per game frame) and stops, drawn gliding;
                        ; tiles = the original's 16 px steps; smooth = the speed and ease below
speed = 8               ; smooth: top speed in px per game frame (scaled to the view width); original = 16 (one tile)
ease = 6                ; smooth: slows down near the target (step <= distance / ease); 0 = constant speed

[player]
; Physics in the original's units: 1/16 px per game frame. Defaults = the 1991 game.
accel = 16              ; speed gained per frame while walking
friction = 12           ; speed lost per frame when not pushing
max_walk = 64           ; top speed (4 px/frame), also in the air and on ladders
max_sneak = 48          ; top speed after a crouch-jump
max_crawl = 32
jump_step = 32          ; extra upward speed per held jump frame
jump_min = 48           ; minimum upward speed of a jump frame
jump_frames = 3         ; how many frames holding jump adds height (3 = about 50 px)
jump_cooldown = 6       ; frames on the ground before the next jump
gravity = 16
max_fall = 192          ; terminal falling speed (12 px/frame)
ladder_speed = 64
drop_crouch_frames = 15 ; crouch this long to drop through thin platforms
start_lives = 2         ; spare lives at a new game (original: 2)
difficulty = high       ; high = the original (a hit costs 2 energy); medium = 1 energy; low = 1 energy, then
                        ; 2 s immune to hits (Titus blinks). Also on the main menu (for that session)
on_death = checkpoint   ; checkpoint = the original: back at the last checkpoint taken (the start if none),
                        ; objects and enemies reset, bonuses kept; restart_level = the whole level again
invincible = 0

[input]
; One line per action: SDL key names and pad:<button> / pad:+<axis> / pad:-<axis>, comma separated.
; Pad buttons are positional (Xbox layout): a = bottom, b = right, x = left, y = top.
left = Left, pad:dpleft, pad:-leftx
right = Right, pad:dpright, pad:+leftx
up = Up, pad:dpup, pad:-lefty
down = Down, pad:dpdown, pad:+lefty
jump = pad:a            ; extra jump buttons: Up (the "up" action) always jumps and climbs, as in 1991
action = Space, Return, pad:x   ; fire: pick up / throw
pause = P, pad:start
menu = Escape, pad:back ; pause menu in a level; backs out of menus
fullscreen = F11
debug_prev_level = PageUp, pad:leftshoulder
debug_next_level = PageDown, pad:rightshoulder
debug_next_song = M, pad:y
debug_sfx = S
debug_fade = F
debug_overlay = F2
debug_die = F1          ; lose a life, like the original's F1
debug_warp = F3         ; move Titus to the next gate entrance, elevator, then the finish
